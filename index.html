<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenmart</title>

    <link rel="stylesheet" href="/public/css/command.css">
    
    <link rel="stylesheet" href="/public/css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">



</head>
<body>
    <div class="navbar_frame">
        <div class="container">
            <div class="navbar_top">
               <a href="./index.html">
                 <img src="/images/icons/logo.png" alt="" />
               </a>
               
               <div class="nav_search_frame">
                <div class="search_box">
                    <div class="category_list">
                        <select name="" id="">
                            <option value="all" selected>All categories</option>
                            <option value="computer">Computer</option>
                        </select>
                    </div>
                    <input type="text" placeholder="Serch products">
                </div>
                <div class="search_icon_box">
                    <img src="/images/icons/search.svg">
                </div>
               </div>
               <div class="nav_top_menu">
                <div class="top_menu_box">
                    <div class="box_icon_box">
                        <img src="/images/icons/heart.svg">
                    </div>
                    <div class="box_info_box">
                        <span>Wishlist</span>
                        <strong>My items</strong>
                    </div>
                </div>
                <div></div>
                <div></div>
               </div>
                <div class="nav_top_menu">
                <div class="top_menu_box">
                    <div class="box_icon_box">
                        <img src="/images/icons/profile.svg">
                    </div>
                    <div class="box_info_box">
                        <span>Sign in</span>
                        <strong>Account</strong>
                    </div>
                </div>
                <div></div>
                <div></div>
               </div>
                <div class="nav_top_menu">
                <div class="top_menu_box">
                    <div class="box_icon_box">
                        <div class="basket_count">2</div>
                        <img src="/images/icons/shopping-cart.svg">
                    </div>
                    <div class="box_info_box">
                        <span>$200</span>
                        <strong>Total</strong>
                    </div>
                </div>
                <div></div>
                <div></div>
               </div>
            </div>
            <div class="navbar_bott">
                <div class="navbar_bott_menu_box">
                    <div class="browse_box">
                        <img src="/images/icons/browse.svg">
                        <span> Browse Categories</span>
                    </div>
                    <div class="navbar_route_menu">
                        <a href="" class="title">Home</a>
                        <a href="">Shop</a>
                        <a href="">Orders</a>
                        <a href="">About</a>
                        <a href="">Contact</a>
                    </div>
                    <div class="sorting_menu">
                        <span>Deal off the day</span>
                        <span>Hot deals</span>
                        <span>Best sallers</span>
                        <span>New arrrivel</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
